name: Build Android APK

on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:
    inputs:
      build_type:
        description: 'APK build type (debug or release)'
        required: true
        default: 'debug'
        type: choice
        options:
          - debug
          - release
      abi:
        description: 'Target Architecture (Note: App is pure Kotlin/Compose, universal APK runs on all ABIs)'
        required: true
        default: 'universal'
        type: choice
        options:
          - universal
          - all
          - arm64-v8a
          - armeabi-v7a
          - x86
          - x86_64

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'gradle'

      - name: Accept Android SDK Licenses & Prepare SDK
        run: |
          export ANDROID_HOME=${ANDROID_HOME:-/usr/local/lib/android/sdk}
          export PATH=$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/cmdline-tools/16.0/bin:$ANDROID_HOME/platform-tools:$PATH
          yes | sdkmanager --licenses || true
          sdkmanager "platforms;android-36" "build-tools;36.0.0" "platform-tools" || true

      - name: Prepare Configuration & Keystore
        run: |
          # 1. Ensure .env exists so Secrets Gradle Plugin is satisfied
          if [ ! -f ".env" ]; then
            if [ -f ".env.example" ]; then
              cp .env.example .env
              echo "Created .env from .env.example"
            else
              echo "GEMINI_API_KEY=" > .env
              echo "Created empty .env"
            fi
          fi

          # 2. Ensure debug.keystore exists for debug signingConfig
          if [ ! -f "debug.keystore" ]; then
            if [ -f "debug.keystore.base64" ]; then
              echo "Restoring debug.keystore from debug.keystore.base64..."
              base64 -d debug.keystore.base64 > debug.keystore
            else
              echo "Generating standard debug.keystore..."
              keytool -genkeypair -v \
                -keystore debug.keystore \
                -alias androiddebugkey \
                -keypass android \
                -storepass android \
                -keyalg RSA \
                -keysize 2048 \
                -validity 10000 \
                -dname "CN=Android Debug,O=Android,C=US"
            fi
          fi

          # 3. Handle release keystore if provided in secrets
          if [ "${{ github.event.inputs.build_type }}" == "release" ] && [ -n "${{ secrets.KEYSTORE_BASE64 }}" ]; then
            echo "Decoding release keystore from secrets..."
            echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > my-upload-key.jks
          fi

      - name: Make Gradle Wrapper Executable
        run: chmod +x ./gradlew

      - name: Clean Build Cache
        run: ./gradlew clean --stacktrace

      - name: Build APK with Gradle
        env:
          KEYSTORE_PATH: ${{ github.workspace }}/my-upload-key.jks
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD || secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS || 'upload' }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          BUILD_TYPE="${{ github.event.inputs.build_type || 'debug' }}"
          echo "Selected build type: $BUILD_TYPE"

          if [ "$BUILD_TYPE" == "release" ]; then
            if [ -f "my-upload-key.jks" ] && [ -n "$STORE_PASSWORD" ]; then
              echo "Building Release APK with signing configuration..."
              ./gradlew assembleRelease --stacktrace
            else
              echo "WARNING: Release signing secrets not configured. Falling back to assembleDebug."
              ./gradlew assembleDebug --stacktrace
            fi
          else
            echo "Building Debug APK..."
            ./gradlew assembleDebug --stacktrace
          fi

      - name: Organize APK Artifacts
        run: |
          mkdir -p dist-apks
          echo "=== Locating generated APKs ==="
          find app/build/outputs/apk -type f -name "*.apk"

          # 1. Process Debug APK (Universal for all ABIs because this app is 100% Kotlin/Compose)
          if [ -f "app/build/outputs/apk/debug/app-debug.apk" ]; then
            cp "app/build/outputs/apk/debug/app-debug.apk" "dist-apks/app-universal.apk"
            cp "app/build/outputs/apk/debug/app-debug.apk" "dist-apks/app-debug.apk"
            echo "Created app-universal.apk and app-debug.apk"
          fi

          # 2. Process Release APK if generated
          if [ -f "app/build/outputs/apk/release/app-release.apk" ]; then
            cp "app/build/outputs/apk/release/app-release.apk" "dist-apks/app-release.apk"
            echo "Created app-release.apk"
          fi

          # 3. Check for any ABI-specific APKs if present in outputs
          if compgen -G "app/build/outputs/apk/*/*arm64-v8a*.apk" > /dev/null; then
            cp app/build/outputs/apk/*/*arm64-v8a*.apk dist-apks/app-arm64-v8a.apk
          fi
          if compgen -G "app/build/outputs/apk/*/*armeabi-v7a*.apk" > /dev/null; then
            cp app/build/outputs/apk/*/*armeabi-v7a*.apk dist-apks/app-armeabi-v7a.apk
          fi
          if compgen -G "app/build/outputs/apk/*/*x86_64*.apk" > /dev/null; then
            cp app/build/outputs/apk/*/*x86_64*.apk dist-apks/app-x86_64.apk
          fi
          if compgen -G "app/build/outputs/apk/*/*x86*.apk" > /dev/null; then
            for f in app/build/outputs/apk/*/*x86*.apk; do
              if [[ "$f" != *"x86_64"* ]]; then
                cp "$f" dist-apks/app-x86.apk
              fi
            done
          fi

          echo "=== Final APK Artifacts to Upload ==="
          ls -lh dist-apks/

      - name: Validate APK Generation
        run: |
          APK_COUNT=$(find dist-apks -type f -name "*.apk" | wc -l)
          if [ "$APK_COUNT" -eq 0 ]; then
            echo "::error::No APK files found in dist-apks! Build failed to generate an APK."
            exit 1
          fi
          echo "Verification passed: $APK_COUNT APK file(s) successfully created."

      - name: Upload APK Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: hazira-hisab-apks
          path: dist-apks/*.apk
          if-no-files-found: error
          retention-days: 14
